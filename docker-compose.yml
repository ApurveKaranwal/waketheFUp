version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: wtfup-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wtfup}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wtfup}
      POSTGRES_DB: ${POSTGRES_DB:-wtfup}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wtfup} -d ${POSTGRES_DB:-wtfup}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - wtfup-network

  redis:
    image: redis:7-alpine
    container_name: wtfup-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - wtfup-network

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: wtfup-api
    command: bun run backend/api.ts
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-wtfup}:${POSTGRES_PASSWORD:-wtfup}@postgres:5432/${POSTGRES_DB:-wtfup}
      REDIS_URL: redis://redis:6379
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://your-domain.com}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      EMAIL_FROM: ${EMAIL_FROM}
      MAX_MONITORS_PER_USER: ${MAX_MONITORS_PER_USER:-10}
      PING_HISTORY_RETENTION_DAYS: ${PING_HISTORY_RETENTION_DAYS:-90}
      EMAIL_ALERT_RETENTION_DAYS: ${EMAIL_ALERT_RETENTION_DAYS:-90}
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:4000/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - wtfup-network

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: wtfup-worker
    command: bun run backend/worker.ts
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-wtfup}:${POSTGRES_PASSWORD:-wtfup}@postgres:5432/${POSTGRES_DB:-wtfup}
      REDIS_URL: redis://redis:6379
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      EMAIL_FROM: ${EMAIL_FROM}
      MAX_MONITORS_PER_USER: ${MAX_MONITORS_PER_USER:-10}
      PING_HISTORY_RETENTION_DAYS: ${PING_HISTORY_RETENTION_DAYS:-90}
      EMAIL_ALERT_RETENTION_DAYS: ${EMAIL_ALERT_RETENTION_DAYS:-90}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - wtfup-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: wtfup-frontend
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
    ports:
      - "3000:3000"
    depends_on:
      - api
    networks:
      - wtfup-network

volumes:
  postgres_data:
  redis_data:

networks:
  wtfup-network:
    driver: bridge