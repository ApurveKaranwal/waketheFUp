name: Keep Render Alive

on:
  schedule:
    # Runs every 10 minutes to prevent Render free-tier from idling to sleep
    - cron: "*/10 * * * *"
  workflow_dispatch: # Allows manual run anytime from GitHub Actions tab

jobs:
  ping:
    name: Ping Health Endpoint
    runs-on: ubuntu-latest
    steps:
      - name: Send keep-alive HTTP GET
        run: |
          URL="${{ secrets.RENDER_API_URL }}"
          if [ -z "$URL" ]; then
            URL="https://wakethefup.onrender.com"
          fi
          echo "Pinging $URL/health/live ..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL/health/live")
          echo "Response code: $STATUS"
