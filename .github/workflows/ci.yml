name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wtfup
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d wtfup"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/wtfup
      REDIS_URL: redis://localhost:6379
      CLERK_SECRET_KEY: sk_test_ci_placeholder
      SMTP_HOST: smtp.example.com
      SMTP_PORT: "587"
      SMTP_USER: ci
      SMTP_PASS: ci
      EMAIL_FROM: alerts@example.com
      CORS_ORIGINS: https://app.example.com
      RUN_DB_INTEGRATION: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun x prisma generate --schema=backend/prisma/schema.prisma
      - run: bun x prisma validate --schema=backend/prisma/schema.prisma
      - run: bun run db:migrate:deploy
      - run: bun x prisma migrate diff --from-schema-datasource=backend/prisma/schema.prisma --to-schema-datamodel=backend/prisma/schema.prisma --exit-code
      - run: bun run test
      - run: bun install --cwd frontend --frozen-lockfile
      - run: node frontend/node_modules/typescript/bin/tsc --noEmit -p tsconfig.json

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --cwd frontend --frozen-lockfile
      - run: bun --cwd frontend lint
      - run: bun --cwd frontend build
