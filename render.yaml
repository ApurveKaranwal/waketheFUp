services:
  - type: web
    name: wakethefup-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    region: ohio
    plan: free
    healthCheckPath: /health/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "4000"
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: SMTP_HOST
        value: smtp.resend.com
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_SECURE
        value: "true"
      - key: SMTP_USER
        value: resend
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_FROM
        value: onboarding@resend.dev
      - key: MAX_MONITORS_PER_USER
        value: "10"
      - key: PING_HISTORY_RETENTION_DAYS
        value: "14"
      - key: EMAIL_ALERT_RETENTION_DAYS
        value: "14"
