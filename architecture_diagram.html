<!DOCTYPE html>

  <title>WakeTheFUp (WTFup) - Architecture Diagram</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #06090e;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 30px 20px;
    }
    .header {
      text-align: center;
      margin-bottom: 24px;
    }
    .header h1 {
      font-size: 28px;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 8px;
    }
    .header p {
      color: #94a3b8;
      font-size: 15px;
    }
    .toolbar {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 20px;
      font-size: 14px;
      font-weight: 600;
      border-radius: 8px;
      border: 1px solid transparent;
      cursor: pointer;
      transition: all 0.2s ease;
      text-decoration: none;
    }
    .btn-primary {
      background: linear-gradient(135deg, #0284c7, #0369a1);
      color: #ffffff;
      box-shadow: 0 4px 14px rgba(2, 132, 199, 0.35);
    }
    .btn-primary:hover {
      background: linear-gradient(135deg, #0369a1, #075985);
      transform: translateY(-1px);
    }
    .btn-secondary {
      background-color: #1e293b;
      color: #e2e8f0;
      border-color: #334155;
    }
    .btn-secondary:hover {
      background-color: #334155;
      transform: translateY(-1px);
    }
    .diagram-container {
      width: 100%;
      max-width: 1200px;
      background-color: #0b0f19;
      border: 1px solid #1e293b;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
      padding: 10px;
    }
    svg {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 10px;
    }
    .toast {
      position: fixed;
      bottom: 24px;
      background-color: #10b981;
      color: #ffffff;
      padding: 12px 24px;
      border-radius: 8px;
      font-weight: 600;
      opacity: 0;
      transform: translateY(20px);
      transition: all 0.3s ease;
      pointer-events: none;
    }
    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>
<body>

  <script>
    function showToast(message) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2500);
    }

    function downloadSVG() {
      const svg = document.getElementById('archDiagram');
      const serializer = new XMLSerializer();
      let source = serializer.serializeToString(svg);
      source = '<?xml version="1.0" standalone="no"?>\r\n' + source;
      const url = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(source);
      const link = document.createElement("a");
      link.href = url;
      link.download = "WakeTheFUp_Architecture.svg";
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      showToast("SVG Diagram Downloaded!");
    }

    function downloadPNG() {
      const svg = document.getElementById('archDiagram');
      const serializer = new XMLSerializer();
      const svgStr = serializer.serializeToString(svg);
      const canvas = document.createElement("canvas");
      const scale = 2; // 2x for ultra sharp resolution (2400x1600)
      canvas.width = 1200 * scale;
      canvas.height = 800 * scale;
      const ctx = canvas.getContext("2d");
      ctx.scale(scale, scale);

      const img = new Image();
      const svgBlob = new Blob([svgStr], { type: "image/svg+xml;charset=utf-8" });
      const URL = window.URL || window.webkitURL || window;
      const blobURL = URL.createObjectURL(svgBlob);

      img.onload = function () {
        ctx.drawImage(img, 0, 0);
        const pngURL = canvas.toDataURL("image/png");
        const downloadLink = document.createElement("a");
        downloadLink.href = pngURL;
        downloadLink.download = "WakeTheFUp_Architecture_LinkedIn.png";
        document.body.appendChild(downloadLink);
        downloadLink.click();
        document.body.removeChild(downloadLink);
        URL.revokeObjectURL(blobURL);
        showToast("High-Res PNG Downloaded!");
      };

      img.src = blobURL;
    }
  </script>
</body>
</html>
